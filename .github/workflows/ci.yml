name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        shell: bash
        env:
          CARGO_TERM_COLOR: never
        run: |
          set -o pipefail
          if ! cargo test 2>&1 | tee test.log; then
            # Surface the failure as annotations so it is visible without the full log.
            { grep -nE 'error|panicked|STATUS_|LNK|failed' test.log | head -n 6; tail -n 3 test.log; } | sed 's/^/::error::/'
            exit 1
          fi
