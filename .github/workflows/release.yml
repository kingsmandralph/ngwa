name: Release

# Pushing a tag like v0.1.0 builds every platform and publishes a GitHub
# Release with the files attached. Running it by hand builds the same files
# without publishing, to check a release before tagging it.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    # The oldest supported Ubuntu, so the binary runs on older glibc too.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p dist/ngwa
          cp target/release/ngwa dist/ngwa/
          cp assets/icon/ngwa-256.png dist/ngwa/ngwa.png
          cp packaging/ngwa.desktop packaging/install-linux.sh dist/ngwa/
          cp README.md LICENSE-MIT LICENSE-APACHE dist/ngwa/
          tar -C dist -czf ngwa-linux-x86_64.tar.gz ngwa
          ls -l target/release/ngwa ngwa-linux-x86_64.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: ngwa-linux-x86_64.tar.gz

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin, x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Build for Apple silicon and Intel
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Package Ngwa.app
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          app=dist/Ngwa.app/Contents
          mkdir -p "$app/MacOS" "$app/Resources"
          lipo -create -output "$app/MacOS/ngwa" \
            target/aarch64-apple-darwin/release/ngwa \
            target/x86_64-apple-darwin/release/ngwa
          cp assets/icon/ngwa.icns "$app/Resources/ngwa.icns"
          sed "s/VERSION/$version/g" packaging/Info.plist > "$app/Info.plist"
          # Not notarised yet: an ad-hoc signature lets it run after the
          # user allows it once.
          codesign --force --deep --sign - dist/Ngwa.app
          ditto -c -k --keepParent dist/Ngwa.app ngwa-macos-universal.zip
          ls -l "$app/MacOS/ngwa" ngwa-macos-universal.zip
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: ngwa-macos-universal.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist/ngwa | Out-Null
          Copy-Item target/release/ngwa.exe, README.md, LICENSE-MIT, LICENSE-APACHE dist/ngwa/
          Compress-Archive -Path dist/ngwa -DestinationPath ngwa-windows-x86_64.zip
          Get-Item target/release/ngwa.exe, ngwa-windows-x86_64.zip | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ngwa-windows-x86_64.zip

  publish:
    needs: [linux, macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Ngwa ${{ github.ref_name }}
          body_path: docs/release-notes/${{ github.ref_name }}.md
          files: dist/*
